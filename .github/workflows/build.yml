name: Build all platforms

on:
  # 只在发版（推送 v* 标签）或手动触发时构建，避免日常提交占用 macOS runner 排队
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    # x64 与 arm64 分别构建。
    # arm64 依赖 windows-11-arm runner 与 PyInstaller 的 arm64 bootloader，
    # 该组合失败不影响 x64 产物（continue-on-error）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Build exe
        shell: cmd
        run: build_exe.bat

      - name: Verify
        shell: pwsh
        run: |
          $exe = "dist/GeminiWatch.exe"
          if (-not (Test-Path $exe)) { throw "GeminiWatch.exe not found" }
          "Runner arch: $env:PROCESSOR_ARCHITECTURE"
          "Python arch: $(python -c 'import platform; print(platform.machine())')"
          "Size: {0:N0} bytes" -f (Get-Item $exe).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-windows-${{ matrix.arch }}
          path: dist/GeminiWatch.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    # 两个架构分别构建：arm64 (Apple Silicon) 与 x64 (Intel)
    # 若 macos-15-intel 标签不可用，可改用自建 Mac 或设置 --target-arch universal2
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Build .app
        env:
          PYTHON: python
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Verify bundle
        run: |
          test -d dist/GeminiWatch.app
          test -x dist/GeminiWatch.app/Contents/MacOS/GeminiWatch
          lipo -archs dist/GeminiWatch.app/Contents/MacOS/GeminiWatch

      - name: Package (keep permissions)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GeminiWatch.app GeminiWatch-macOS-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-macOS-${{ matrix.arch }}
          path: GeminiWatch-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pillow pystray

      - name: Build binary
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name GeminiWatch \
            --add-data "panel.html:." \
            --collect-submodules pystray \
            gemini_watch.py

      - name: Verify and package
        run: |
          test -x dist/GeminiWatch
          tar -czf GeminiWatch-linux-x64.tar.gz -C dist GeminiWatch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-linux-x64
          path: GeminiWatch-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    # 只有推送 v* 标签时才发布；always() 保证某个架构失败也能发布其余产物
    needs: [windows, macos, linux]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          copy_if() {
            if [ -f "$1" ]; then cp "$1" "$2"; fi
          }
          copy_if artifacts/GeminiWatch-windows-x64/GeminiWatch.exe "release/GeminiWatch-${GITHUB_REF_NAME}-windows-x64.exe"
          copy_if artifacts/GeminiWatch-windows-arm64/GeminiWatch.exe "release/GeminiWatch-${GITHUB_REF_NAME}-windows-arm64.exe"
          copy_if artifacts/GeminiWatch-macOS-arm64/GeminiWatch-macOS-arm64.zip "release/GeminiWatch-${GITHUB_REF_NAME}-macOS-arm64.zip"
          copy_if artifacts/GeminiWatch-macOS-x64/GeminiWatch-macOS-x64.zip "release/GeminiWatch-${GITHUB_REF_NAME}-macOS-x64.zip"
          copy_if artifacts/GeminiWatch-linux-x64/GeminiWatch-linux-x64.tar.gz "release/GeminiWatch-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          ls -lh release
          if [ -z "$(ls -A release)" ]; then
            echo "没有可发布的产物"
            exit 1
          fi

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows x64 | \`GeminiWatch-${GITHUB_REF_NAME}-windows-x64.exe\` |
          | Windows ARM64 | \`GeminiWatch-${GITHUB_REF_NAME}-windows-arm64.exe\` |
          | macOS Apple Silicon | \`GeminiWatch-${GITHUB_REF_NAME}-macOS-arm64.zip\` |
          | macOS Intel | \`GeminiWatch-${GITHUB_REF_NAME}-macOS-x64.zip\` |
          | Linux x64 | \`GeminiWatch-${GITHUB_REF_NAME}-linux-x64.tar.gz\` |

          ## 使用

          运行后托盘出现图标，面板地址 <http://127.0.0.1:47131>。配置与日志在用户数据目录自动生成：

          - Windows: \`%APPDATA%\\GeminiWatch\`
          - macOS: \`~/Library/Application Support/GeminiWatch\`
          - Linux: \`~/.config/GeminiWatch\`

          ## 注意

          - macOS 应用未签名，首次打开需执行 \`xattr -dr com.apple.quarantine GeminiWatch.app\`
          - Windows 可执行文件如被标记，右键属性勾选「解除锁定」
          - Linux 无图形桌面时使用 \`--no-tray\` 参数
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md release/*
          fi
