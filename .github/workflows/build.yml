name: Build all platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    # x64 与 arm64 分别构建。
    # arm64 依赖 windows-11-arm runner 与 PyInstaller 的 arm64 bootloader，
    # 该组合失败不影响 x64 产物（continue-on-error）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Build exe
        shell: cmd
        run: build_exe.bat

      - name: Verify
        shell: pwsh
        run: |
          $exe = "dist/GeminiWatch.exe"
          if (-not (Test-Path $exe)) { throw "GeminiWatch.exe not found" }
          "Runner arch: $env:PROCESSOR_ARCHITECTURE"
          "Python arch: $(python -c 'import platform; print(platform.machine())')"
          "Size: {0:N0} bytes" -f (Get-Item $exe).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-windows-${{ matrix.arch }}
          path: dist/GeminiWatch.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    # 两个架构分别构建：arm64 (Apple Silicon) 与 x64 (Intel)
    # 若 macos-15-intel 标签不可用，可改用自建 Mac 或设置 --target-arch universal2
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Build .app
        env:
          PYTHON: python
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Verify bundle
        run: |
          test -d dist/GeminiWatch.app
          test -x dist/GeminiWatch.app/Contents/MacOS/GeminiWatch
          lipo -archs dist/GeminiWatch.app/Contents/MacOS/GeminiWatch

      - name: Package (keep permissions)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GeminiWatch.app GeminiWatch-macOS-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-macOS-${{ matrix.arch }}
          path: GeminiWatch-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pillow pystray

      - name: Build binary
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name GeminiWatch \
            --add-data "panel.html:." \
            --collect-submodules pystray \
            gemini_watch.py

      - name: Verify and package
        run: |
          test -x dist/GeminiWatch
          tar -czf GeminiWatch-linux-x64.tar.gz -C dist GeminiWatch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWatch-linux-x64
          path: GeminiWatch-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
